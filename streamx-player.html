<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stream en Vivo</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest/dist/hls.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
  video { width: 100%; height: 100%; background: #000; }
  #msg { color: #fff; padding: 20px; font-family: sans-serif; }
</style>
</head>
<body>
<video id="video" autoplay muted controls playsinline></video>
<div id="msg"></div>
<script>
  const params = new URLSearchParams(location.search);
  const stream = params.get('stream') || 'dsports';

  function showError(err) {
    document.getElementById('msg').textContent = 'Error al cargar el stream: ' + err;
  }

  fetch('/api/streamx-token?stream=' + encodeURIComponent(stream))
    .then(r => r.json())
    .then(data => {
      if (!data.url) throw new Error(data.error || 'Sin URL');

      const video = document.getElementById('video');
      if (Hls.isSupported()) {
        const hls = new Hls();
        hls.loadSource(data.url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => { video.play().then(() => { video.muted = false; }).catch(() => {}); });
        hls.on(Hls.Events.ERROR, (_, d) => { if (d.fatal) showError(d.details); });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = data.url;
        video.addEventListener('loadedmetadata', () => { video.play().then(() => { video.muted = false; }).catch(() => {}); });
      } else {
        showError('navegador no soportado');
      }
    })
    .catch(err => showError(err.message));
</script>
</body>
</html>
