<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DSports en Vivo</title>
<script src="https://cdn.jsdelivr.net/npm/shaka-player@4/dist/shaka-player.compiled.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
  video { width: 100%; height: 100%; background: #000; }
  #msg { color: #fff; padding: 20px; font-family: sans-serif; }
</style>
</head>
<body>
<video id="video" autoplay muted controls playsinline></video>
<div id="msg"></div>
<script>
  const params = new URLSearchParams(location.search);
  const id = params.get('id') || 'dsports1';

  function showError(err) {
    document.getElementById('msg').textContent = 'Error al cargar DSports: ' + err;
  }

  fetch('/api/dsports-token?id=' + encodeURIComponent(id))
    .then(r => r.json())
    .then(data => {
      if (!data.channelUrl) throw new Error(data.error || 'Sin URL');

      shaka.polyfill.installAll();
      if (!shaka.Player.isBrowserSupported()) { showError('navegador no soportado'); return; }

      const video = document.getElementById('video');
      const player = new shaka.Player();
      player.attach(video).then(() => {
        player.getNetworkingEngine().registerResponseFilter((type, response) => {
          if (type === shaka.net.NetworkingEngine.RequestType.MANIFEST) {
            const txt = new TextDecoder('utf-8').decode(response.data);
            const cleaned = txt.replace(/<ContentProtection schemeIdUri="urn:uuid:[^"]*"[\s\S]*?<\/ContentProtection>/gi, '');
            if (cleaned !== txt) {
              response.data = new TextEncoder().encode(cleaned).buffer;
            }
          }
        });
        if (data.keyId && data.keyValue) {
          player.configure({ drm: { clearKeys: { [data.keyId]: data.keyValue } } });
        }
        player.configure({
          abr: { enabled: false },
          restrictions: { minHeight: 1080, maxHeight: 1080 }
        });

        function selectBest1080() {
          const tracks = player.getVariantTracks().filter(t => t.height === 1080);
          if (!tracks.length) return;
          const best = tracks.reduce((a, b) => (b.bandwidth > a.bandwidth ? b : a));
          if (!best.active) player.selectVariantTrack(best, true);
        }
        player.addEventListener('trackschanged', selectBest1080);

        return player.load(data.channelUrl);
      }).then(() => {
        const tracks = player.getVariantTracks().filter(t => t.height === 1080);
        if (tracks.length) {
          const best = tracks.reduce((a, b) => (b.bandwidth > a.bandwidth ? b : a));
          player.selectVariantTrack(best, true);
        }
        video.play().then(() => { video.muted = false; }).catch(() => {});
      }).catch(err => showError(err.message || err));
      player.addEventListener('error', e => showError(e.detail && e.detail.message));
    })
    .catch(err => showError(err.message));
</script>
</body>
</html>
